name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    # The backend suite runs against a real Postgres. There is no in-memory
    # stand-in the way moto stood in for DynamoDB, and SQLite would not be
    # faithful -- jsonb and ILIKE both differ.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openexec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff is pinned deliberately: an unpinned linter means a release on
          # PyPI can break CI with no code change behind it (ruff 0.16 widening
          # its default rules did exactly that). Bump this on purpose, not by
          # surprise.
          pip install -e . 'ruff==0.15.11' pytest pytest-cov
          # Additive: the only overlap with the root requirements is an
          # identical pytest pin. -dev pulls in runtime deps via `-r`.
          pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check openexec/ src/ tests/ backend/

      - name: Secrets scan
        run: |
          # Fail if any tracked text file contains a long API key or token.
          if grep -rInE --binary-files=without-match --exclude-dir=.git \
              --exclude-dir=node_modules --exclude-dir=__pycache__ \
              '(api[_-]?key|secret|token)[^=]{0,20}[=:][[:space:]]*["'"'"'][A-Za-z0-9_\-]{20,}' \
              . ; then
            echo "Potential secret found (above). Remove it from tracked files."
            exit 1
          fi
          if grep -rInE --binary-files=without-match --exclude-dir=.git \
              'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' . ; then
            echo "Known secret format found (above). Remove it from tracked files."
            exit 1
          fi
          echo "No secrets detected."

      - name: Backend tests
        # backend/pytest.ini sets `pythonpath = . ..`, which only resolves
        # `app` and `openexec` when pytest runs from backend/.
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openexec_test
        run: pytest -q

      - name: Test
        # test_cli.py exercises the live LLM path; excluded from CI.
        run: pytest tests/ --ignore=tests/test_cli.py -q

      - name: Coverage gate
        run: |
          pytest tests/ --ignore=tests/test_cli.py -q \
            --cov=openexec.main --cov=openexec.risk_analyzer \
            --cov=openexec.grounding --cov=openexec.export \
            --cov=openexec.event_store --cov-report=term-missing \
            --cov-fail-under=70

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f backend/Dockerfile -t openexec-api .

      - name: Build the web image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL=/api -t openexec-web .

      - name: Web build must fail without VITE_API_BASE_URL
        # src/api/client.ts falls back to the in-memory mock layer when the
        # base URL is empty, so an unguarded build ships a bundle that serves
        # fabricated decisions. Assert the guard is still wired.
        run: |
          if docker build -f frontend/Dockerfile \
               --build-arg VITE_API_BASE_URL= -t openexec-web-should-fail . ; then
            echo "Build succeeded with an empty VITE_API_BASE_URL -- the guard"
            echo "in frontend/Dockerfile is gone. That bundle would silently"
            echo "serve mock data."
            exit 1
          fi
          echo "Guard held: the build refused."

      - name: No credentials baked into the API image
        # .dockerignore is the only thing keeping a developer's settings.json
        # (gitignored, holds api_key) out of the build context.
        run: |
          if docker run --rm --entrypoint sh openexec-api \
               -c 'ls /app/settings.json' 2>/dev/null; then
            echo "settings.json is present in the image."
            exit 1
          fi
          echo "No settings.json in the image."

      - name: Bring up the stack and check it end to end
        run: |
          # A dummy LLM config: enough for the boot probe to pass. No
          # deliberation runs here, so the dead endpoint is never dialled.
          mkdir -p /tmp/openexec
          cat > /tmp/openexec/settings.json <<'JSON'
          {"ai": {"base_url": "http://127.0.0.1:9/v1", "api_key": "",
                  "model": "ci", "timeout": 5},
           "agents": {"enabled": ["ceo", "cfo", "cto", "cmo"]}}
          JSON

          export OPENEXEC_SETTINGS_FILE=/tmp/openexec/settings.json
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.local.yml"
          $COMPOSE up -d --build

          # `web` depends_on api's healthcheck, so reaching this means the API
          # booted -- which with OPENEXEC_REQUIRE_SETTINGS=1 means the mount
          # and OPENEXEC_SETTINGS_PATH both resolved.
          for i in $(seq 1 30); do
            if curl -fsS localhost/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "--- /api/health ---"
          curl -fsS localhost/api/health | tee /tmp/health.json
          grep -q '"settings_found":true' /tmp/health.json

          # Proves nginx strips the /api prefix and routes to the API.
          echo "--- /api/agents ---"
          curl -fsS localhost/api/agents | head -c 200

          # Proves the SPA is served.
          curl -fsS localhost/ | grep -qi '<div id="root"'

          # --workers 1 is load-bearing (in-process SSE fan-out, run lock,
          # cancellation registry). python:slim has no `ps`, so read PID 1's
          # command line directly -- uvicorn is the entrypoint.
          cmdline=$($COMPOSE exec -T api python -c \
            "print(open('/proc/1/cmdline','rb').read().decode().replace(chr(0),' '))")
          echo "api PID 1: $cmdline"
          echo "$cmdline" | grep -q -- "--workers 1" || {
            echo "uvicorn is not pinned to a single worker"; exit 1; }

          $COMPOSE down -v
