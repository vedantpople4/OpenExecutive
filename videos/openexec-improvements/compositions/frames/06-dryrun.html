<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Frame 6 — Run It Before You Run It</title>
    <!-- Head is metadata for the source file only; the runtime ignores it.
         All styles, markup, and scripts MUST live inside <template> below. -->
  </head>
  <body>
    <template>
      <!--
        HyperFrames sub-composition — Frame 6: RUN IT BEFORE YOU RUN IT
        Blueprint: typewriter-reveal (Benefits — a live caret types the
        dry-run line, then the estimate lands as the payoff beat)
        Design preset: openexec-demo terminal identity — same bare-stage
        prompt-line pattern as videos/openexec-demo/compositions/01-open.html
        (no window chrome here — a quieter, single-line terminal beat).
        Duration: 5.0s
      -->

      <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

      <style>
        :root {
          --bg: #0A130F;
          --panel: #0F1B15;
          --fg: #ECEFEA;
          --fg-dim: #8A9690;
          --accent: #34C77B;
          --hairline: #20302A;
          --display: "Oswald", sans-serif;
          --mono: "JetBrains Mono", monospace;
        }

        #f6-root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          background: var(--bg);
          font-family: var(--mono);
          overflow: hidden;
        }

        #f6-root .grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(var(--hairline) 1px, transparent 1px),
            linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
          background-size: 64px 64px;
          opacity: 0.18;
        }

        #f6-root .panel {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 1200px;
          transform: translate(-50%, -50%);
        }

        #f6-root .prompt-line {
          font-size: 30px;
          font-weight: 700;
          color: var(--accent);
          margin-bottom: 30px;
        }
        #f6-root .caret {
          display: inline-block;
          width: 16px;
          height: 30px;
          margin-left: 2px;
          background: var(--accent);
          transform: translateY(6px);
        }

        #f6-root .estimate {
          padding-left: 40px;
          border-left: 1px solid var(--hairline);
        }
        #f6-root .estimate-line {
          font-size: 24px;
          line-height: 1.7;
          color: var(--fg);
          opacity: 0;
          will-change: transform, opacity;
        }
        #f6-root .estimate-line .val {
          color: var(--accent);
          font-weight: 700;
        }
        #f6-root .estimate-line .sep {
          color: var(--fg-dim);
          margin: 0 18px;
        }

        #f6-root .frame-kicker {
          position: absolute;
          bottom: 44px;
          left: 0;
          right: 0;
          text-align: center;
          font-family: var(--mono);
          font-size: 16px;
          letter-spacing: 0.06em;
          color: var(--fg-dim);
        }
      </style>

      <div id="f6-root"
           data-composition-id="f6"
           data-start="0"
           data-width="1920"
           data-height="1080"
           data-duration="5">

        <div class="grid"></div>

        <div class="panel">
          <div class="prompt-line">$ <span id="f6-cmd-text"></span><span class="caret" id="f6-caret"></span></div>
          <div class="estimate">
            <div class="estimate-line" id="f6-e1">
              Estimated LLM calls: <span class="val">9&ndash;15</span>
            </div>
            <div class="estimate-line" id="f6-e2">
              <span class="sep">&middot;</span>Estimated time: <span class="val">3m&ndash;5m</span>
            </div>
          </div>
        </div>

        <div class="frame-kicker" id="f6-frame-kicker">
          06 &nbsp;/&nbsp; RUN IT BEFORE YOU RUN IT
        </div>

      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var tl = gsap.timeline({ paused: true });

          tl.fromTo("#f6-frame-kicker",
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.5, ease: "power2.out" },
            0.1
          );

          /* Live-typed command line, deterministic proxy-driven reveal. */
          var fullCmd = 'openexec run "..." --dry-run';
          var proxy = { n: 0 };
          var cmdEl = document.getElementById("f6-cmd-text");
          tl.to(proxy, {
            n: fullCmd.length,
            duration: 1.3,
            ease: "none",
            onUpdate: function () {
              var i = Math.round(proxy.n);
              cmdEl.textContent = fullCmd.slice(0, i);
            }
          }, 0.2);

          var caretCycles = Math.max(0, Math.floor(1.3 / 0.24) - 1);
          tl.to("#f6-caret",
            { autoAlpha: 0.0, duration: 0.12, ease: "power1.inOut",
              repeat: caretCycles, yoyo: true },
            0.2
          );
          tl.set("#f6-caret", { autoAlpha: 0 }, 1.5);

          /* The estimate is the payoff — each line types-in as a settle,
             landing under the persistent typed command line. */
          tl.fromTo("#f6-e1",
            { autoAlpha: 0, y: 8 },
            { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" },
            1.7
          );
          tl.fromTo("#f6-e2",
            { autoAlpha: 0, y: 8 },
            { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" },
            2.2
          );

          window.__timelines["f6"] = tl;
        })();
      </script>
      </template>
  </body>
</html>
