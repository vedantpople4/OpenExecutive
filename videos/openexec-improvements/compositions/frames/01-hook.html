<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Frame 1 — Hook</title>
    <!-- Head is metadata for the source file only; the runtime ignores it.
         All styles, markup, and scripts MUST live inside <template> below. -->
  </head>
  <body>
    <template>
      <!--
        HyperFrames sub-composition — Frame 1: THE HOOK
        Blueprint: kinetic-type-beats (Hook, sub-shape B word-run build)
        Design preset: openexec-demo terminal identity (bg/panel/fg/accent/hairline,
        Oswald + JetBrains Mono) — matched to videos/openexec-demo for series
        consistency. See videos/openexec-demo/frame.md for the source tokens.
        Duration: 5.0s
      -->

      <!-- No external <link> font imports — the HyperFrames producer resolves
           Google Fonts by family name at compile/render (matches the sibling
           openexec-demo project's approach; avoids the raw-fetch lint warning). -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

      <style>
        :root {
          --bg: #0A130F;
          --panel: #0F1B15;
          --fg: #ECEFEA;
          --fg-dim: #8A9690;
          --accent: #34C77B;
          --hairline: #20302A;
          --display: "Oswald", sans-serif;
          --mono: "JetBrains Mono", monospace;
        }

        #f1-root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          background: var(--bg);
          font-family: var(--mono);
          overflow: hidden;
        }

        #f1-root .grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(var(--hairline) 1px, transparent 1px),
            linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
          background-size: 64px 64px;
          opacity: 0.18;
        }

        #f1-root .statement {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 1500px;
          text-align: center;
          font-family: var(--display);
          font-weight: 700;
          font-size: 72px;
          line-height: 1.3;
          letter-spacing: 0.005em;
          color: var(--fg);
        }

        #f1-root .word {
          display: inline-block;
          will-change: transform, opacity;
        }

        #f1-root .word.accent {
          color: var(--accent);
        }

        #f1-root .frame-kicker {
          position: absolute;
          bottom: 44px;
          left: 0;
          right: 0;
          text-align: center;
          font-family: var(--mono);
          font-size: 16px;
          letter-spacing: 0.06em;
          color: var(--fg-dim);
        }
      </style>

      <div id="f1-root"
           data-composition-id="f1"
           data-start="0"
           data-width="1920"
           data-height="1080"
           data-duration="5">

        <div class="grid"></div>

        <p class="statement" id="f1-statement">
          <span class="word" id="f1-w1">The</span>
          <span class="word" id="f1-w2">last</span>
          <span class="word" id="f1-w3">time</span>
          <span class="word" id="f1-w4">you</span>
          <span class="word" id="f1-w5">saw</span>
          <span class="word" id="f1-w6">OpenExec&hellip;</span>
          <br>
          <span class="word" id="f1-w7">it</span>
          <span class="word" id="f1-w8">was</span>
          <span class="word accent" id="f1-w9">a</span>
          <span class="word accent" id="f1-w10">demo.</span>
        </p>

        <div class="frame-kicker" id="f1-frame-kicker">
          01 &nbsp;/&nbsp; THE LAST TIME
        </div>

      </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var tl = gsap.timeline({ paused: true });

          /* Word-by-word staggered build — a real terminal doesn't bounce,
             so this is a plain autoAlpha + y settle (power2.out), never
             spring/elastic. All 10 words land by ~2.6s, leaving a long hold
             on the full line with the "a demo." pair already accented so
             the closing beat lands without a color-change tween. */
          var words = ["#f1-w1", "#f1-w2", "#f1-w3", "#f1-w4", "#f1-w5",
                        "#f1-w6", "#f1-w7", "#f1-w8", "#f1-w9", "#f1-w10"];

          tl.fromTo(words,
            { autoAlpha: 0, y: 14 },
            { autoAlpha: 1, y: 0, duration: 0.32, ease: "power2.out",
              stagger: 0.22 },
            0.15
          );

          tl.fromTo("#f1-frame-kicker",
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.5, ease: "power2.out" },
            0.2
          );

          window.__timelines["f1"] = tl;
        })();
      </script>
      </template>
  </body>
</html>
