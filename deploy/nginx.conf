# Serves the built SPA and proxies the API on one origin, so the browser never
# makes a cross-origin request and OPENEXEC_CORS_ORIGINS stops mattering.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: the router owns /compare, /dashboard, etc., so a deep link
    # or a refresh must return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Trailing slash on proxy_pass strips the /api prefix: a request for
    # /api/decisions reaches the API as /decisions. The frontend sets
    # VITE_API_BASE_URL=/api and endpoints.real.ts concatenates paths onto it.
    location /api/ {
        proxy_pass http://api:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Server-Sent Events. Both lines are required. ---
        #
        # GET /decisions/{id}/events streams the deliberation live. With the
        # default proxy_buffering on, nginx accumulates the response and the
        # user watches a frozen screen for the whole run, then gets the entire
        # timeline at once -- the live view's entire purpose, silently lost.
        proxy_buffering off;
        proxy_cache off;
        # Connection: close upstream keep-alive semantics for the event stream.
        proxy_set_header Connection "";

        # A deliberation is 5-26 sequential LLM calls and the stream stays open
        # for all of it. nginx's 60s default would sever every run in progress.
        # Generous rather than tight: a cancelled run currently emits no
        # terminal event, so the connection lingers until the client closes it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed asset filenames -- safe to cache hard. index.html deliberately is
    # not cached, so a redeploy is picked up on the next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
