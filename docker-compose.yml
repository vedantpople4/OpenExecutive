# Production topology: one box, two containers.
#
#   docker compose up -d
#
# nginx (web) is the only thing listening publicly; the API is reachable only
# on the compose network. The database is external (Supabase), reached with a
# connection string -- there are no ambient cloud credentials to get wrong.
#
# For local development against a Postgres container, layer the override on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# See deploy/README.md for the full runbook.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # Supabase: use the session-pooler string, not the direct connection --
      # direct is IPv6-only without the paid IPv4 add-on. No default on
      # purpose: a missing URL should stop the stack, not silently point it at
      # a local Postgres that is not there.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # Path *inside* the container; the host side is the volume below.
      OPENEXEC_SETTINGS_PATH: /etc/openexec/settings.json
      # Turns a missing or misplaced LLM config into a boot failure instead of
      # a full deliberation of stub reports. See probe_settings in app/main.py.
      OPENEXEC_REQUIRE_SETTINGS: "1"
    volumes:
      # The LLM credentials. Mounted read-only, never baked into the image
      # (.dockerignore excludes settings.json from the build context).
      # If the host path does not exist, Docker creates a *directory* there and
      # the API will crash-loop on the probe -- which is the intended outcome,
      # but check for a stray directory when debugging a failed first boot.
      - ${OPENEXEC_SETTINGS_FILE:-/etc/openexec/settings.json}:/etc/openexec/settings.json:ro
    # Deliberately no `ports`. nginx proxies to api:8000 over the compose
    # network; exposing 8000 on the host would bypass it.

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the bundle at build time. Relative, so the browser hits
        # the same origin nginx already serves the SPA from.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
