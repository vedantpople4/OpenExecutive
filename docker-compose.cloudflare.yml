# Cloudflare Tunnel overlay -- see deploy/README.md step 6.
#
# Adds an outbound-only connector so the box can serve HTTPS without opening a
# single inbound port. cloudflared dials Cloudflare's edge and traffic comes
# back down that connection, which means:
#   - no Security List ingress rule, and no fighting the instance firewall
#     (the two things that break most first deploys on Oracle)
#   - the origin IP is never published in DNS
#   - TLS is terminated at the edge, so nginx keeps its plain :80 server block
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # `run` with a token needs no config file and no mounted credentials --
    # the token itself identifies the tunnel. Create it in the Cloudflare
    # dashboard (Zero Trust -> Networks -> Tunnels) and put it in .env.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    # Reaches `web` over the compose network, so nothing has to be published
    # on the host at all.
    depends_on:
      - web
