# Local development override. Layer it on top of the production file:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# A separate file rather than a compose profile so a plain `docker compose
# up -d` on the server can never start a throwaway database alongside the
# real one.

services:
  api:
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/openexec
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openexec
    ports:
      # 5433 on the host so `python -m scripts.create_tables` can reach it from
      # outside the compose network without colliding with a Homebrew Postgres
      # already on 5432 -- which is what the test suite uses.
      - "5433:5432"
    healthcheck:
      # depends_on alone only waits for the container, not for Postgres to
      # accept connections, and the API's first query would lose that race.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
